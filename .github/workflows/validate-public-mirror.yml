name: Validate Public Mirror

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate-public-mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run cross-platform public mirror validator
        run: python scripts/validate-public-mirror.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run JavaScript regression tests
        run: node --test scripts/dashboard-utils.test.js scripts/dashboard-date-format.test.mjs

      - name: Run dashboard storage smoke check
        run: node scripts/dashboard-utils.smoke.mjs
