<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Utils Tests</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 2rem;
      line-height: 1.5;
    }
    h1 {
      font-size: 1.5rem;
      border-bottom: 1px solid #ccc;
      padding-bottom: 0.5rem;
    }
    #test-results {
      list-style-type: none;
      padding: 0;
    }
    .test-result {
      padding: 0.5rem;
      margin-bottom: 0.5rem;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    .test-pass {
      background-color: #e6ffed;
      border-color: #2ea043;
      color: #05500c;
    }
    .test-fail {
      background-color: #ffebe9;
      border-color: #cf222e;
      color: #82071e;
    }
    .error-details {
      margin-top: 0.5rem;
      font-family: monospace;
      white-space: pre-wrap;
      background: rgba(0,0,0,0.05);
      padding: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>Dashboard Utils Test Suite</h1>
  <div id="summary">Running tests...</div>
  <ul id="test-results"></ul>

  <script type="module" src="./dashboard-utils.test.js"></script>
</body>
</html>
